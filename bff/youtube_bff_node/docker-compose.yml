services:
  mongo:
    image: mongo:7
    container_name: studyforielts-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: studyforielts
      MONGO_INITDB_ROOT_PASSWORD: studyforielts_local_password
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: studyforielts-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: studyforielts
      ME_CONFIG_MONGODB_ADMINPASSWORD: studyforielts_local_password
      ME_CONFIG_MONGODB_URL: mongodb://studyforielts:studyforielts_local_password@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

volumes:
  mongo-data:
