services:
  - type: web
    runtime: python
    name: studyforielts-youtube-bff
    rootDir: bff/youtube_scraper
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: StudyForIELTS
      - key: MONGODB_COLLECTION
        value: curatedvideos
      - key: ADMIN_TOKEN
        sync: false
      - key: DEFAULT_SEARCH_LIMIT
        value: "10"
      - key: MAX_SEARCH_LIMIT
        value: "25"
      - key: FEED_PAGE_SIZE
        value: "20"
      - key: MAX_FEED_PAGE_SIZE
        value: "50"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: "trung-cheap"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: LLM_STREAM
        value: "true"
      - key: YOUTUBE_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: YOUTUBE_TRANSCRIPT_PROXY_PROVIDER
        value: generic
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
      - key: WEBSHARE_PROXY_LOCATIONS
        value: us
      - key: WEBSHARE_RETRIES_WHEN_BLOCKED
        value: "10"
      - key: YOUTUBE_PROXY_URL
        sync: false
      - key: YOUTUBE_TRANSCRIPT_PROXY_URL
        sync: false
